# Kasi — nginx reverse proxy
#
# Routes :
#   /              -> proxy -> admin-panel:80   (conteneur Angular/nginx interne)
#   /admin-api/    -> proxy -> admin-api:3000   (GraphQL + WS subscriptions)
#   /driver-api/   -> proxy -> driver-api:3002  (GraphQL + WS subscriptions)
#   /rider-api/    -> proxy -> rider-api:3001   (GraphQL + WS subscriptions)
#
# Les blocs location/gzip/headers sont factorises dans kasi-locations.conf,
# partages entre ce serveur HTTP (dev local) et le serveur HTTPS de prod
# (.nginx/ssl-kasigroupe.conf, monte uniquement sur le VPS via
# docker-compose.override.yml — voir .nginx/ssl-placeholder.md).
#
# CORS : gere au niveau nginx sur les blocs proxy.
#   Les APIs NestJS gardent app.enableCors() (utile en acces direct dev sur
#   :3000/:3001/:3002) ; leurs en-tetes CORS sont masques via
#   proxy_hide_header pour eviter les doublons (les navigateurs rejettent les
#   Access-Control-Allow-Origin en double).

# -- Mapping WebSocket upgrade -------------------------------------------------
# Necessite pour les subscriptions GraphQL (graphql-ws / subscriptions-transport-ws).
# Ce bloc map est au niveau http (les fichiers conf.d sont inclus dans http{}).
map $http_upgrade $connection_upgrade {
    default  upgrade;
    ""       close;
}

# -- Protocole d origine derriere un proxy amont ------------------------------
# Aujourd hui nginx termine lui-meme le TLS : $http_x_forwarded_proto est vide
# et on retombe sur $scheme (https en prod, http en dev local) — comportement
# strictement inchange.
# Derriere Traefik (Dokploy), c est Traefik qui termine le TLS : nginx recoit
# la requete en clair sur :80 et $scheme vaut "http". Sans ce map, les APIs
# NestJS recevraient X-Forwarded-Proto: http alors que le client est en HTTPS.
map $http_x_forwarded_proto $forwarded_proto {
    default  $http_x_forwarded_proto;
    ""       $scheme;
}

# -- IP client reelle derriere un proxy amont ---------------------------------
# Plages privees Docker/Swarm uniquement : une requete venant d Internet n a
# jamais une IP source dans ces plages, donc aucun client ne peut usurper son
# adresse via X-Forwarded-For. Sans ceci, $remote_addr vaut l IP de Traefik
# pour toutes les requetes une fois derriere Dokploy (logs et rate-limiting
# aveugles).
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header   X-Forwarded-For;
real_ip_recursive on;

server {
    listen 80;
    server_name _;

    include /etc/nginx/kasi-locations.conf;
}
