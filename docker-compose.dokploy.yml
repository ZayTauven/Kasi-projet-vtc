# =============================================================================
# Kasi — Stack Docker Compose pour Dokploy
#
# Variante de docker-compose.yml destinee a etre deployee PAR Dokploy
# (type de service "Compose"). Elle n est PAS utilisable telle quelle en dev
# local hors Dokploy : elle suppose le reseau externe `dokploy-network` et le
# repertoire persistant `../files/` crees par Dokploy.
#
#   docker-compose.yml          -> dev local a la main, et prod SSH historique
#   docker-compose.dokploy.yml  -> deploiement Dokploy (local, staging, prod)
#
# Architecture cible :
#   Internet -> Traefik (Dokploy, :80/:443, TLS Let s Encrypt automatique)
#            -> nginx (ce fichier, :80 interne)
#            -> admin-panel / admin-api / driver-api / rider-api
#
# Le routage applicatif (/admin-api/, /driver-api/, /rider-api/, WebSocket,
# CORS, resolver DNS dynamique) reste integralement dans .nginx/ : Traefik ne
# fait que terminer le TLS et router le domaine vers ce nginx. C est
# volontaire — les apps mobiles deja installees tapent en dur sur ces prefixes,
# les reecrire en middlewares Traefik casserait le parc existant.
#
# Configuration a renseigner dans l UI Dokploy (onglet Environment) :
#   voir .env.dokploy.example
# =============================================================================

# -----------------------------------------------------------------------------
# Reseaux
#   kasi-net       : bridge interne, isole. Seul nginx en sort.
#   dokploy-network: reseau externe cree par l installation de Dokploy. Traefik
#                    n atteint que les conteneurs qui y sont attaches — ici
#                    nginx uniquement, donc les APIs et la base ne sont
#                    joignables depuis l exterieur par aucun chemin.
# -----------------------------------------------------------------------------
networks:
  kasi-net:
    driver: bridge
  dokploy-network:
    external: true

# -----------------------------------------------------------------------------
# Volumes nommes — prefixes automatiquement par Dokploy avec le nom du service,
# ce qui permet a plusieurs environnements (prod, staging) de cohabiter sur le
# meme hote sans se marcher dessus.
# -----------------------------------------------------------------------------
volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local

# p1-sentry (2026-10-20) : rotation des journaux des API (fiche
# docs/fiche-suivi-des-erreurs.md §5) : 5 fichiers de 10 Mo au plus par conteneur.
x-api-logging: &api-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:

  # ===========================================================================
  # Infrastructure
  # ===========================================================================

  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME requis}
      POSTGRES_USER: ${DB_USER:?DB_USER requis}
      POSTGRES_PASSWORD: ${DB_PASS:?DB_PASS requis}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - kasi-net
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${DB_USER} -d ${DB_NAME}
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD requis}
    volumes:
      - redis-data:/data
    networks:
      - kasi-net
    healthcheck:
      test:
        - CMD
        - redis-cli
        - -a
        - ${REDIS_PASSWORD}
        - ping
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ===========================================================================
  # Migrations du schema (p1-migrations, 2026-09-28) — meme role que dans
  # docker-compose.yml : conteneur ponctuel qui applique les migrations puis
  # s'arrete ; les trois API attendent sa reussite. Sur une base NEUVE
  # (staging), c'est lui qui cree tout le schema : `synchronize` n'existe plus.
  # Construit depuis le Dockerfile d'admin-api (le bundle `migrate.js` y est
  # produit a cote de `main.js`) ; les couches sont partagees avec admin-api
  # par le cache de build, le surcout est negligeable.
  # Voir docs/migrations-base-de-donnees.md.
  # ===========================================================================

  migrate:
    build:
      context: .
      dockerfile: apps/admin-api/Dockerfile
    command: ["node", "migrate.js", "run"]
    restart: "no"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kasi-net

  # ===========================================================================
  # APIs NestJS
  # Contexte de build = racine du monorepo, comme docker-compose.yml.
  # Dokploy clone le depot dans <compose>/code/ et build depuis la.
  # ===========================================================================

  admin-api:
    build:
      context: .
      dockerfile: apps/admin-api/Dockerfile
    restart: unless-stopped
    logging: *api-logging
    environment:
      ADMIN_API_PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      # p2-argent I2 (2026-10-19) : grand livre. shadow (defaut) : une erreur
      # du grand livre est journalisee sans bloquer ; strict : elle annule
      # l'operation. Voir docs/migrations-base-de-donnees.md (grand livre).
      LEDGER_MODE: ${LEDGER_MODE:-shadow}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requis}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
      # p1-sentry : suivi des erreurs (GlitchTip ou Sentry, meme protocole).
      # Vide = aucun envoi. Ne jamais journaliser le DSN.
      SENTRY_DSN_ADMIN_API: ${SENTRY_DSN_ADMIN_API:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
    volumes:
      # ATTENTION — difference majeure avec docker-compose.yml.
      # Dokploy re-clone le depot a CHAQUE deploiement dans <compose>/code/ :
      # un montage `./config` pointerait vers ce clone et serait donc efface a
      # chaque deploiement. `config/` et `data/` etant par ailleurs gitignores,
      # ils reviendraient vides -> perte de la cle de service Firebase, de
      # config.production.json et de TOUS les uploads, a chaque `git push`.
      # `../files/` est le repertoire frere du clone, gere par Dokploy et
      # jamais efface : c est la que doivent vivre les donnees runtime.
      - ../files/config:/app/config
      - ../files/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - kasi-net

  driver-api:
    build:
      context: .
      dockerfile: apps/driver-api/Dockerfile
    restart: unless-stopped
    logging: *api-logging
    environment:
      DRIVER_API_PORT: 3002
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      # p2-argent I2 (2026-10-19) : grand livre. shadow (defaut) : une erreur
      # du grand livre est journalisee sans bloquer ; strict : elle annule
      # l'operation. Voir docs/migrations-base-de-donnees.md (grand livre).
      LEDGER_MODE: ${LEDGER_MODE:-shadow}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
      # p1-sentry : suivi des erreurs (GlitchTip ou Sentry, meme protocole).
      # Vide = aucun envoi. Ne jamais journaliser le DSN.
      SENTRY_DSN_DRIVER_API: ${SENTRY_DSN_DRIVER_API:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
    volumes:
      # Meme repertoire partage que admin-api et rider-api (un avatar chauffeur
      # uploade via driver-api doit etre servi par admin-api).
      - ../files/config:/app/config
      - ../files/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - kasi-net

  rider-api:
    build:
      context: .
      dockerfile: apps/rider-api/Dockerfile
    restart: unless-stopped
    logging: *api-logging
    environment:
      RIDER_API_PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      # p2-argent I2 (2026-10-19) : grand livre. shadow (defaut) : une erreur
      # du grand livre est journalisee sans bloquer ; strict : elle annule
      # l'operation. Voir docs/migrations-base-de-donnees.md (grand livre).
      LEDGER_MODE: ${LEDGER_MODE:-shadow}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
      # p1-sentry : suivi des erreurs (GlitchTip ou Sentry, meme protocole).
      # Vide = aucun envoi. Ne jamais journaliser le DSN.
      SENTRY_DSN_RIDER_API: ${SENTRY_DSN_RIDER_API:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
    volumes:
      - ../files/config:/app/config
      - ../files/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - kasi-net

  # ===========================================================================
  # Frontend
  # ===========================================================================

  admin-panel:
    build:
      context: .
      dockerfile: apps/admin-panel/Dockerfile
      args:
        # Token public Mapbox, injecte dans le bundle au build (voir
        # apps/admin-panel/Dockerfile). Changer ce token impose un rebuild
        # complet du panel : ce n est pas une variable runtime.
        MAPBOX_TOKEN: ${MAPBOX_TOKEN:-}
    restart: unless-stopped
    depends_on:
      - admin-api
    networks:
      - kasi-net

  # ===========================================================================
  # Reverse proxy interne — SEUL service expose a Traefik.
  #
  # Pas de bloc `ports:` : Dokploy/Traefik detiennent :80 et :443 sur l hote.
  # Le domaine se configure dans l UI Dokploy (onglet Domains) en ciblant le
  # service `nginx` sur le port `80` — pas ici, car il change d un
  # environnement a l autre (kasi.localhost en local, staging.kasigroupe.tech,
  # kasigroupe.tech) et deux stacks sur le meme hote ne peuvent pas declarer
  # le meme routeur Traefik.
  #
  # ssl-kasigroupe.conf n est volontairement PAS monte : le TLS est termine par
  # Traefik, qui gere aussi le renouvellement Let s Encrypt. Le certbot manuel
  # de l hote et son cron deviennent inutiles une fois cette stack en service.
  # ===========================================================================
  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    volumes:
      - ./.nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.nginx/kasi-locations.conf:/etc/nginx/kasi-locations.conf:ro
    depends_on:
      - admin-panel
      - admin-api
      - driver-api
      - rider-api
    networks:
      - kasi-net
      - dokploy-network
