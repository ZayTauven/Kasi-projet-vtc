query DriversList($paging: OffsetPaging, $filter: DriverFilter, $sorting: [DriverSort!]) {
    drivers(paging: $paging, filter: $filter, sorting: $sorting) {
        nodes {
            id
            firstName
            lastName
            gender
            mobileNumber
            status
            registrationTimestamp
            wallet {
                balance
                currency
            }
        }
        totalCount
    }
    moneyPolicies {
        currency
        debtLimit
        debtAlertThreshold
    }
}

# p2-argent I3 : Kasimen au-dela du plafond de dette (filtre « bloques »).
query DebtBlockedDriverIds {
    debtBlockedDriverIds
}
# p2-kyc K2 : Kasimen suspendus pour document expire (filtre « suspendus »).
query DocumentSuspendedDriverIds {
    documentSuspendedDriverIds
}
