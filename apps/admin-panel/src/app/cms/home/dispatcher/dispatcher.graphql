query DispatcherCalculateFare($points: [PointInput!]!) {
  calculateFare(input: { points: $points }) {
    currency
    distance
    duration
    services {
      name
      services {
        id
        name
        cost
      }
    }
  }
}

mutation CreateOrder(
  $riderId: ID!
  $points: [PointInput!]!
  $addresses: [String!]!
  $serviceId: ID!
  $intervalMinutes: Int!
) {
  createOrder(
    input: {
      points: $points
      serviceId: $serviceId
      addresses: $addresses
      intervalMinutes: $intervalMinutes
      riderId: $riderId
    }
  ) {
    id
  }
}

subscription OrderUpdated($id: ID!) {
  orderUpdated(orderId: $id) {
    id
    status
    driver {
      firstName
      lastName
      mobileNumber
    }
  }
}

mutation CancelOrder($orderId: ID!, $cancelReasonId: ID) {
  cancelOrder(orderId: $orderId, cancelReasonId: $cancelReasonId) {
    id
    status
  }
}

# p3-mesures M4 (A3) : catalogue des motifs. Le filtre par auteur et par
# etat se fait cote panel (userType et isEnabled ne sont pas filtrables).
query DispatcherCancelReasons {
  orderCancelReasons(paging: { limit: 50 }, sorting: [{ field: id, direction: ASC }]) {
    nodes {
      id
      title
      isEnabled
      userType
    }
  }
}
