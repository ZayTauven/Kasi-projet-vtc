overwrite: true
schema: 
  - "http://localhost/admin-api/graphql"
documents: "apps/admin-panel/src/**/*.graphql"
generates:
  apps/admin-panel/generated/graphql.ts:
    plugins:
      - "typescript"
      - "typescript-operations"
      - "typescript-apollo-angular"

  ./admin.schema.json:
    plugins:
      - introspection

        